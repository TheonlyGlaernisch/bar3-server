name: Apply internal banking transfer

on:
  push:
    branches:
      - agent/internal-banking-transfer
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/internal-banking-transfer
          fetch-depth: 0

      - name: Patch internal transfer support
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Patch marker not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          db = 'discord-bot/src/database.ts'
          replace_once(db,
              "  | 'manual-offshore'\n  | 'offshore-migration'\n  | 'reconcile';",
              "  | 'manual-offshore'\n  | 'offshore-migration'\n  | 'internal-transfer'\n  | 'reconcile';")
          replace_once(db,
              "  async getAlliancePoolBalance(guildId: string): Promise<BankingResourceBalance> {",
              """  async transferNationBankBalance(\n    guildId: string,\n    fromNationId: number,\n    toNationId: number,\n    delta: Partial<BankingResourceBalance>,\n    actorDiscordId: string,\n    note: string | null = null\n  ): Promise<{ ok: true; sourceBalance: BankingResourceBalance; destinationBalance: BankingResourceBalance; ledgerId: string } | { ok: false; error: string; balance?: BankingResourceBalance }> {\n    if (!Number.isInteger(fromNationId) || fromNationId <= 0 || !Number.isInteger(toNationId) || toNationId <= 0) return { ok: false, error: 'Source and destination nation IDs must be positive integers.' };\n    if (fromNationId === toNationId) return { ok: false, error: 'Source and destination accounts must be different.' };\n    const change = this._normalizeBankingBalance(delta);\n    if (!BANKING_RESOURCE_KEYS.some((key) => change[key] > 0)) return { ok: false, error: 'Provide at least one positive resource amount.' };\n    for (const key of BANKING_RESOURCE_KEYS) if (change[key] < 0) return { ok: false, error: `${key} amount cannot be negative.` };\n    const session = this._client.startSession();\n    try {\n      let result: { ok: true; sourceBalance: BankingResourceBalance; destinationBalance: BankingResourceBalance; ledgerId: string } | { ok: false; error: string; balance?: BankingResourceBalance } = { ok: false, error: 'Transfer failed.' };\n      try {\n        await session.withTransaction(async () => {\n          const sourceDoc = await this._nationBankBalances.findOne({ guild_id: guildId, nation_id: fromNationId }, { projection: { _id: 0 }, session });\n          const sourceBalance = this._normalizeBankingBalance(sourceDoc?.balances);\n          for (const key of BANKING_RESOURCE_KEYS) {\n            if (change[key] > sourceBalance[key]) { result = { ok: false, error: `Insufficient ${key} balance.`, balance: sourceBalance }; throw new Error('__TRANSFER_REJECTED__'); }\n          }\n          const destinationDoc = await this._nationBankBalances.findOne({ guild_id: guildId, nation_id: toNationId }, { projection: { _id: 0 }, session });\n          const destinationBalance = this._normalizeBankingBalance(destinationDoc?.balances);\n          const nextSource = this._emptyBankingBalance();\n          const nextDestination = this._emptyBankingBalance();\n          for (const key of BANKING_RESOURCE_KEYS) { nextSource[key] = sourceBalance[key] - change[key]; nextDestination[key] = destinationBalance[key] + change[key]; }\n          const now = new Date().toISOString();\n          await this._nationBankBalances.updateOne({ guild_id: guildId, nation_id: fromNationId }, { $set: { guild_id: guildId, nation_id: fromNationId, balances: nextSource, updated_at: now } }, { upsert: true, session });\n          await this._nationBankBalances.updateOne({ guild_id: guildId, nation_id: toNationId }, { $set: { guild_id: guildId, nation_id: toNationId, balances: nextDestination, updated_at: now } }, { upsert: true, session });\n          const ledgerId = randomUUID();\n          await this._bankingLedger.insertOne({ ledger_id: ledgerId, guild_id: guildId, nation_id: fromNationId, type: 'internal-transfer', status: 'completed', resources: change, source_transaction_id: null, idempotency_key: `internal-transfer:${guildId}:${fromNationId}:${toNationId}:${ledgerId}`, note: note || `Internal transfer from nation ${fromNationId} to nation ${toNationId}`, actor_discord_id: actorDiscordId, error: null, created_at: now, updated_at: now }, { session });\n          result = { ok: true, sourceBalance: nextSource, destinationBalance: nextDestination, ledgerId };\n        });\n      } catch (error) {\n        if (!(error instanceof Error) || error.message !== '__TRANSFER_REJECTED__') throw error;\n      }\n      return result;\n    } finally {\n      await session.endSession();\n    }\n  }\n\n  async getAlliancePoolBalance(guildId: string): Promise<BankingResourceBalance> {""")

          banking = 'discord-bot/src/banking.ts'
          replace_once(banking, "\n\n  async withdrawToNation(\n", """\n\n  async transferInternalFunds(\n    guildId: string,\n    fromNationId: number,\n    toNationId: number,\n    resourcesInput: Partial<BankingResourceBalance>,\n    actorDiscordId: string,\n    note: string | null = null\n  ): Promise<{ ok: true; sourceBalance: BankingResourceBalance; destinationBalance: BankingResourceBalance; ledgerId: string } | { ok: false; error: string; balance?: BankingResourceBalance }> {\n    const cfg = await this._db.getBankingConfig(guildId);\n    if (!cfg.enabled) return { ok: false, error: 'Banking is currently disabled for this guild.' };\n    const resources = normalizeBalance(resourcesInput);\n    if (!hasAnyAmount(resources)) return { ok: false, error: 'Provide at least one positive resource amount.' };\n    return this._db.transferNationBankBalance(guildId, fromNationId, toNationId, resources, actorDiscordId, note);\n  }\n\n  async withdrawToNation(\n""")

          docs = 'discord-bot/src/commandDocs.ts'
          replace_once(docs, "  { name: '/banking withdraw [resources]', summary: 'Withdraw resources from offshore to your registered nation balance.', category: 'core' },", "  { name: '/banking transfer <recipient> [resources]', summary: 'Transfer internal tracked banking resources from your account to another registered account.', category: 'core' },\n  { name: '/banking withdraw [resources]', summary: 'Withdraw resources from offshore to your registered nation balance.', category: 'core' },")

          index = 'discord-bot/src/index.ts'
          replace_once(index, "  if (i.commandName === 'banking') {\n    if (sub === 'withdraw') return 'banking_withdraw';", "  if (i.commandName === 'banking') {\n    if (sub === 'transfer') return 'banking_transfer';\n    if (sub === 'withdraw') return 'banking_withdraw';")
          replace_once(index, "    new SlashCommandBuilder().setName('banking').setDescription('Banking commands')\n      .addSubcommand(sc => sc.setName('balance').setDescription('View your registered nation deposit balance'))", """    new SlashCommandBuilder().setName('banking').setDescription('Banking commands')\n      .addSubcommand(sc => sc.setName('transfer').setDescription('Transfer internal tracked resources to another registered account')\n        .addUserOption(o => o.setName('recipient').setDescription('Discord user receiving the internal transfer').setRequired(true))\n        .addNumberOption(o => o.setName('money').setDescription('Money amount'))\n        .addNumberOption(o => o.setName('food').setDescription('Food amount'))\n        .addNumberOption(o => o.setName('coal').setDescription('Coal amount'))\n        .addNumberOption(o => o.setName('oil').setDescription('Oil amount'))\n        .addNumberOption(o => o.setName('uranium').setDescription('Uranium amount'))\n        .addNumberOption(o => o.setName('iron').setDescription('Iron amount'))\n        .addNumberOption(o => o.setName('bauxite').setDescription('Bauxite amount'))\n        .addNumberOption(o => o.setName('lead').setDescription('Lead amount'))\n        .addNumberOption(o => o.setName('gasoline').setDescription('Gasoline amount'))\n        .addNumberOption(o => o.setName('munitions').setDescription('Munitions amount'))\n        .addNumberOption(o => o.setName('steel').setDescription('Steel amount'))\n        .addNumberOption(o => o.setName('aluminum').setDescription('Aluminum amount')))\n      .addSubcommand(sc => sc.setName('balance').setDescription('View your registered nation deposit balance'))""")
          replace_once(index, "      if (commandName === 'banking_set_api_keys') {", """      if (commandName === 'banking_transfer') {\n        if (!interaction.guildId) return void interaction.reply({ content: 'Guild only command.', flags: MessageFlags.Ephemeral });\n        if (!await hasMemberAccess(interaction, db)) return void interaction.reply({ content: 'You need the Member role to use this command.', flags: MessageFlags.Ephemeral });\n        const sender = await db.getByDiscordId(BigInt(interaction.user.id));\n        if (!sender) return void interaction.reply({ content: 'You do not have a registered nation.', flags: MessageFlags.Ephemeral });\n        const recipientUser = interaction.options.getUser('recipient', true);\n        if (recipientUser.bot) return void interaction.reply({ content: 'Bots cannot receive banking transfers.', flags: MessageFlags.Ephemeral });\n        const recipient = await db.getByDiscordId(BigInt(recipientUser.id));\n        if (!recipient) return void interaction.reply({ content: 'The recipient does not have a registered nation.', flags: MessageFlags.Ephemeral });\n        if (recipient.nation_id === sender.nation_id) return void interaction.reply({ content: 'Source and destination accounts must be different.', flags: MessageFlags.Ephemeral });\n        const resources = getResourceOptionsFromInteraction(interaction);\n        if (!hasPositiveResourceInput(resources)) return void interaction.reply({ content: 'Provide at least one resource amount greater than zero.', flags: MessageFlags.Ephemeral });\n        await interaction.deferReply({ flags: MessageFlags.Ephemeral });\n        const result = await banking.transferInternalFunds(interaction.guildId, sender.nation_id, recipient.nation_id, resources, interaction.user.id, `Discord internal transfer ${sender.nation_id} -> ${recipient.nation_id}`);\n        if (!result.ok) return void interaction.followUp({ content: `Internal transfer failed: ${result.error}`, flags: MessageFlags.Ephemeral });\n        return void interaction.followUp({ content: `Internal transfer completed.\\nFrom nation **${sender.nation_id}** → nation **${recipient.nation_id}** (<@${recipientUser.id}>)\\n\\nResources:\\n${formatResourceSummary(resources)}\\n\\nYour remaining balance:\\n${formatResourceSummary(result.sourceBalance)}`, flags: MessageFlags.Ephemeral });\n      }\n\n      if (commandName === 'banking_set_api_keys') {""")

          test = 'discord-bot/test_db.mjs'
          p = Path(test)
          text = p.read_text()
          if "test('internal banking transfer validates nation IDs'" not in text:
              marker = "test('global offshore alliance ID config supports fallback and override', async () => {"
              if marker not in text: raise SystemExit('test marker not found')
              block = "test('internal banking transfer validates nation IDs', async () => {\n  const db = await makeDb();\n  const result = await db.transferNationBankBalance('test-guild', 0, 2, { money: 10 }, 'discord-user');\n  assert.equal(result.ok, false);\n});\n\n"
              p.write_text(text.replace(marker, block + marker, 1))

      - name: Verify TypeScript and tests
        working-directory: discord-bot
        run: |
          npm install
          npm run build
          node test_db.mjs

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discord-bot/src/database.ts discord-bot/src/banking.ts discord-bot/src/index.ts discord-bot/src/commandDocs.ts discord-bot/test_db.mjs
          git rm .github/workflows/apply-internal-transfer.yml
          git commit -m "Add internal banking transfer command"
          git push origin agent/internal-banking-transfer
